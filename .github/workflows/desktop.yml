name: MAITV Desktop Windows alpha

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Test remote protocol and Windows credential storage
        working-directory: desktop
        run: npm test
      - name: Build Windows installer and portable EXE
        working-directory: desktop
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: maitv-desktop-windows-private-alpha
          path: |
            desktop/dist/MAITV-Desktop-Setup-*.exe
            desktop/dist/MAITV-Desktop-Portable-*.exe
          retention-days: 7
