<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">MAITV</title>
  <desc id="desc">Neon M displayed inside a futuristic television, encircled by an orbital ring and overlaid with a directional control pad.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142c5e"/><stop offset=".56" stop-color="#09152f"/><stop offset="1" stop-color="#18448a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#081b42"/><stop offset=".55" stop-color="#0b1740"/><stop offset="1" stop-color="#171046"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#24f8eb"/><stop offset=".52" stop-color="#07bbff"/><stop offset="1" stop-color="#8455ff"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" x2="1">
      <stop offset="0" stop-color="#22fff2"/><stop offset=".66" stop-color="#018eff"/><stop offset="1" stop-color="#a855ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="url(#orbit)" stroke-width="13" stroke-linecap="round" opacity=".86">
