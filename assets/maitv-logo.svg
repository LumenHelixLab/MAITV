  </g>
  <rect x="210" y="277" width="92" height="90" rx="24" fill="#0a1a3d" opacity=".98"/>
  <circle cx="256" cy="322" r="13" fill="#18efec"/>
  <path d="M256 292 l-12 17 h24 Z M256 354 l-12 -17 h24 Z M226 322 l17 -12 v24 Z M286 322 l-17 -12 v24 Z" fill="#c9faff"/>
  <path d="M223 389 h66 l20 33 h-106 Z" fill="url(#frame)"/>
