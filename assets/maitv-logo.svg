  <rect x="75" y="147" width="362" height="225" rx="22" fill="url(#screen)" stroke="url(#neon)" stroke-width="9"/>
  <path d="M139 318 V195 L256 278 L373 195 V318 L326 318 V277 L256 330 L186 277 V318 Z" fill="url(#neon)"/>
  <path d="M139 195 L186 216 V318 H139 Z" fill="#078bda" opacity=".65"/>
  <path d="M326 279 L373 195 V318 H326 Z" fill="#714cf5" opacity=".5"/>
  <g filter="url(#glow)" stroke="#00e9f6" stroke-opacity=".36" stroke-width="2" fill="none">
