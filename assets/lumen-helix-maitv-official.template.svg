<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#050912"/><stop offset=".55" stop-color="#0a1531"/><stop offset="1" stop-color="#161136"/></linearGradient>
  <linearGradient id="maitv" x1="0" x2="1"><stop stop-color="#e9f9ff"/><stop offset=".38" stop-color="#20dffc"/><stop offset=".76" stop-color="#4995ff"/><stop offset="1" stop-color="#ca81fc"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#643bb0" stop-opacity=".40"/><stop offset="1" stop-color="#5638b0" stop-opacity="0"/></radialGradient>
  <pattern id="mesh" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#355879" stroke-width=".6" opacity=".25"/></pattern>
</defs>
<rect width="1440" height="420" rx="20" fill="url(#bg)"/>
<rect width="1440" height="420" rx="20" fill="url(#mesh)" opacity=".8"/>
